<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SafeGuard - Emergency Contact Directory">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SafeGuard Nigeria</title>
  
  <style>
    body {
      background-color: #fcfcfc;
      margin: 0;
      height: 100vh;
      width: 100vw;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* FIX 1: Use position fixed to stay on top of the Flutter app */
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #fcfcfc;
      z-index: 99999; /* Ensure it stays on top */
      transition: opacity 0.8s ease-out;
    }

    /* FIX 2: Allow clicks to pass through once we start fading */
    #loading-indicator.fading {
      opacity: 0;
      pointer-events: none; 
    }

    .pulse-logo {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, #f44336 0%, #b71c1c 100%);
      border-radius: 24px;
      display: flex; justify-content: center; align-items: center;
      position: relative;
      animation: bounce 2s infinite ease-in-out;
    }

    .pulse-logo i { color: white; font-size: 42px; font-weight: 900; font-style: normal; }

    .pulse-logo::before {
      content: ''; position: absolute; width: 100%; height: 100%;
      background-color: #f44336; border-radius: 24px;
      z-index: -1; animation: ripple 2s infinite;
    }

    .loading-text {
      margin-top: 40px; font-size: 14px; color: #b71c1c;
      font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
      animation: fadeText 1.5s infinite alternate;
    }

    @keyframes ripple { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.8); opacity: 0; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes fadeText { from { opacity: 0.3; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div id="loading-indicator">
    <div class="pulse-logo"><i>SOS</i></div>
    <div class="loading-text" id="status-text">Preparing Emergency Access...</div>
  </div>

  <script>
    {{flutter_bootstrap_js}}

    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine({
            renderer: "html", 
          });
          
          await appRunner.runApp();

          // FIX 3: Robust removal logic
          const loader = document.getElementById('loading-indicator');
          if (loader) {
            loader.classList.add('fading'); // Trigger CSS transition
            setTimeout(() => {
              loader.remove();
              // Clean up body overflow to allow scrolling if the app needs it
              document.body.style.overflow = 'visible';
            }, 800);
          }
        }
      });
    });
  </script>
</body>
</html>
