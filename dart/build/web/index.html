<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SafeGuard - Emergency Contact Directory">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preload critical fonts -->
  <link rel="preload" href="assets/fonts/Montserrat-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Montserrat-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Montserrat-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <title>SafeGuard Nigeria</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #fcfcfc;
      z-index: 99999;
      transition: opacity 0.8s ease-out;
      font-family: 'Segoe UI', sans-serif;
    }

    #loading-indicator.fading {
      opacity: 0;
      pointer-events: none;
    }

    .pulse-logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #f44336 0%, #b71c1c 100%);
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: bounce 2s infinite ease-in-out;
    }

    .pulse-logo i {
      color: white;
      font-size: 42px;
      font-weight: 900;
      font-style: normal;
    }

    .pulse-logo::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #f44336;
      border-radius: 24px;
      z-index: -1;
      animation: ripple 2s infinite;
    }

    .loading-text {
      margin-top: 40px;
      font-size: 14px;
      color: #b71c1c;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeText 1.5s infinite alternate;
    }

    .loading-bar-wrapper {
      margin-top: 30px;
      width: 200px;
      height: 4px;
      background-color: #f5c6c6;
      border-radius: 10px;
      overflow: hidden;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f44336, #b71c1c);
      border-radius: 10px;
      animation: fillBar 2s ease-out forwards;
    }

    @keyframes ripple {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(1.8); opacity: 0;   }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0);     }
      50%       { transform: translateY(-12px); }
    }

    @keyframes fadeText {
      from { opacity: 0.3; }
      to   { opacity: 1;   }
    }

    @keyframes fillBar {
      0%   { width: 0%;   }
      60%  { width: 75%;  }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <div id="loading-indicator">
    <div class="pulse-logo"><i>SOS</i></div>
    <div class="loading-text">Preparing Emergency Access...</div>
    <div class="loading-bar-wrapper">
      <div class="loading-bar"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loading-indicator');
      if (loader && !loader.classList.contains('fading')) {
        loader.classList.add('fading');
        setTimeout(function () {
          loader.remove();
          document.body.style.overflow = 'visible';
        }, 800);
      }
    }

    // Hide loader when Flutter signals first frame
    window.addEventListener('flutter-first-frame', hideLoader);

    // Force hide after 2 seconds no matter what
    setTimeout(hideLoader, 2000);
  </script>

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

</body>
</html>
